<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <div class="card">
        <div class="heading"><h1>Registration</h1>
            </div>
            <div class="tagline"><p>Personal Details</p></div>
  
    <form action="#" method="post">
        <div class="row">
        <div class="field">
        
        <label for="fullname">Full Name</label>
        <input type="text" name="fullname" id="fullname" placeholder="Enter full name"></div>
        <div class="field"> <label for="birthdate"> Birth Date</label>
        <input type="text" name="birthdate" id="birthdate" placeholder="Enter Birth Date "></div>
        <div class="field"> <label for="email">Email</label>
        <input type="text" name="email" id="email" placeholder="email"></div>
   
          

        <div class="field">
         <label for="mobilenumber">Mobile Number</label>
        <input type="tel" name="mobilenumber" id="mobilenumber" placeholder="Enter mobile number"></div>
        <div class="field"> <label for="gender">Gender</label>
        <input type="text" name="gender" id="gender" placeholder="Enter Your Gender"></div>
        <div class="field"> <label for="occupation">Occupation</label>
        <input type="text" name="occupation" id="occupation" placeholder="Enter your occupation"></div>
    </div>

      <p>  Identity Details</p>
         
        <div class="row">
        <div class="field"> <label for="idtype">ID type</label>

        <input type="text" name="idtype" placeholder="Enter your id type" id="idtype"></div>
        <div class="field">  <label for="idnumber">ID number</label>
         <input type="text" name="idnumber" placeholder="Enter your id number" id="idnumber"></div>
         <div class="field"> <label for="issueauthority">Issue Authority</label>
        <input type="text" name="issueauthority" id="issueauthority" placeholder="Enter your department"></div>
        <div class="field"> <label for="issuedate">Issue Date</label>
        <input type="text" name="issuedate" id="issuedate" placeholder="Enter id issue Date"></div>
        <div class="field"> <label for="issuestate">Issue State</label>
        <input type="text" name="issuestate" id="issuestate" placeholder="Enter ID issue state"></div>
        <div class="field"> <label for="expirydate">Expiray Date</label>
        <input type="text" name="expirydate" id="expirydate" placeholder="Enter ID expiry date"></div>
        <button type="submit" class="btn"><i class="fa-solid fa-arrow-right-long"></i> Next</button>
    </form>

</div>

   
   
</body>
</html>
